name: g2 success chronology source transfer (not release)

on:
  push:
    branches:
      - coord/564-publish-success-chronology

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'KanujVerma/drift' && github.ref == 'refs/heads/coord/564-publish-success-chronology'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact product parent without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 27ec3bd356da536d772f4e8b95bdda9ad8df1546
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and transfer only the three-file reviewed repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          parent = '27ec3bd356da536d772f4e8b95bdda9ad8df1546'
          expected_tree = 'be3cb635a1e33c46543a5cb6ab10b1168b030376'
          expected_patch = '79ecd035e8f8fecf162be82e2522f99f1e229b278a41868edf9cbd0ef0d4e7fd'
          blob_sha = 'f366c735e216f17e5345055e6040e95cc7f96e54'
          allowed = {
              'src/drift/loop/stage1_synthetic_research_execution.py',
              'tests/adversarial/test_stage1_research_execution_integrity.py',
              'docs/architecture/adaptive-experiments/verification/stage1-research-execution-candidate.md',
          }
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD') != parent or git('status', '--porcelain'):
              raise SystemExit('Unexpected or dirty source parent')
          request = urllib.request.Request(
              'https://api.github.com/repos/KanujVerma/drift/git/blobs/' + blob_sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              item = json.load(response)
          if item['sha'] != blob_sha or item['encoding'] != 'base64':
              raise SystemExit('Unexpected transfer blob')
          transport = base64.b64decode(''.join(item['content'].split()), validate=True)
          digest = hashlib.sha1(b'blob ' + str(len(transport)).encode() + b'\0' + transport).hexdigest()
          if digest != blob_sha or len(transport) != 9595:
              raise SystemExit('Transfer blob integrity failure')
          # Exactly two diff-header transport spaces were independently identified.
          # This does not rewrite any source line; final bytes and tree are pinned.
          if transport.count(b'\n diff --git ') != 2:
              raise SystemExit('Unexpected transfer envelope')
          patch = transport.replace(b'\n diff --git ', b'\ndiff --git ')
          if len(patch) != 9593 or hashlib.sha256(patch).hexdigest() != expected_patch:
              raise SystemExit('Patch does not match locally tested bytes')
          path = Path(os.environ['RUNNER_TEMP']) / 'success-chronology.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          if set(git('diff', '--cached', '--name-only').splitlines()) != allowed:
              raise SystemExit('Unexpected writable path')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          if git('write-tree') != expected_tree:
              raise SystemExit('Published tree differs from tested tree')
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run([
              'git', 'commit', '--author=Kanuj Verma <108971272+KanujVerma@users.noreply.github.com>',
              '-m', 'fix(stage1): enforce original success-path causal ordering (#564)',
              '-m', 'ChatGPT authored the exact three-file repair under Kanuj authorization. This job mechanically verifies and transfers its tree; it is not independent review or G2 acceptance.',
          ], check=True)
          if git('rev-parse', 'HEAD^{tree}') != expected_tree or git('rev-parse', 'HEAD^') != parent:
              raise SystemExit('Unexpected committed source identity')
          target = 'refs/heads/coord/564-success-chronology-source'
          auth = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          environment = dict(os.environ)
          environment.update({
              'GIT_CONFIG_COUNT': '1',
              'GIT_CONFIG_KEY_0': 'http.https://github.com/.extraheader',
              'GIT_CONFIG_VALUE_0': 'AUTHORIZATION: basic ' + auth,
          })
          exists = subprocess.check_output(['git', 'ls-remote', 'origin', target], env=environment, text=True).strip()
          if exists:
              raise SystemExit('Auxiliary source ref already exists; refusing overwrite')
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + target], env=environment, check=True)
          print('Verified source commit:', git('rev-parse', 'HEAD'))
          print('Verified source tree:', expected_tree)
          PY
