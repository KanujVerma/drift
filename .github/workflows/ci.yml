# Canonical verification gate (issue #48).
#
# CI observes repository truth; it never repairs it. This workflow never
# regenerates fixtures, never updates replay baselines, never commits and never
# pushes. The interpreter is read only from .python-version, the same pin uv
# and the pinned-replay guard in tests/_pinned_m1d.py use locally.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: canonical verification gate
    runs-on: ubuntu-latest
    # The full suite takes about 22 minutes on a developer laptop; hosted
    # runners are slower.
    timeout-minutes: 120
    env:
      # Every uv command must use uv.lock exactly as committed.
      UV_LOCKED: "1"
      # Use a uv-managed CPython build, never an ambient system interpreter.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Check out the full history
        # Pinned M1d replay extracts historical commits with git archive.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify PR changes (only allowlisted Markdown skips full tests)
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          docs_only = False
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              base = os.environ.get("PR_BASE_SHA", "")
              if not re.fullmatch(r"[0-9a-f]{40}", base):
                  raise SystemExit("Invalid PR base SHA; cannot classify changes")
              raw = subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", "-z", base, "HEAD"]
              )
              paths = [os.fsdecode(item) for item in raw.split(b"\0") if item]

              def is_documentation(path):
                  return path in ("AGENTS.md", "README.md") or (
                      path.startswith("docs/") and path.endswith(".md")
                  )

              docs_only = bool(paths) and all(is_documentation(p) for p in paths)
              print("Changed PR paths:", repr(paths))
              if not paths:
                  print("Empty diff: full verification required")
          else:
              print("Push to main: full verification required")

          print("Documentation-only fast path:", docs_only)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"docs_only={str(docs_only).lower()}\n")
          PY
      - name: Check changed Markdown links and forbidden punctuation
        if: steps.scope.outputs.docs_only == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path.cwd().resolve()
          raw = subprocess.check_output(
              ["git", "diff", "--name-only", "--no-renames", "-z",
               os.environ["PR_BASE_SHA"], "HEAD"]
          )
          paths = [Path(os.fsdecode(p)) for p in raw.split(b"\0") if p]
          failures = []
          checked = 0
          for path in paths:
              if not path.exists():
                  continue  # Deleted Markdown file.
              if path.is_symlink() or not path.is_file():
                  failures.append(f"{path}: expected a regular Markdown file")
                  continue
              text = path.read_text(encoding="utf-8")
              checked += 1
              if "\u2014" in text:
                  failures.append(f"{path}: forbidden U+2014 em dash")

              visible_lines = []
              fence = None
              for line in text.splitlines():
                  stripped = line.lstrip()
                  marker = stripped[:3]
                  if marker in ("```", "~~~"):
                      if fence is None:
                          fence = marker
                      elif fence == marker:
                          fence = None
                      continue
                  if fence is None:
                      visible_lines.append(line)

              for match in re.finditer(
                  r"(?<!!)\[[^\]]+\]\(([^)]+)\)", "\n".join(visible_lines)
              ):
                  target = match.group(1).strip().split(" ", 1)[0].strip("<>")
                  if not target or target.startswith(("#", "//")):
                      continue
                  parsed = urlsplit(target)
                  if parsed.scheme or parsed.netloc or not parsed.path:
                      continue  # External URL or same-page anchor.
                  resolved = (path.parent / unquote(parsed.path)).resolve()
                  if not resolved.is_relative_to(root) or not resolved.exists():
                      failures.append(f"{path}: unresolved link {target}")

          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Documentation checks passed for {checked} changed Markdown files")
          PY
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Provision the interpreter pinned in .python-version
        run: |
          echo "interpreter pin: $(cat .python-version)"
          if ! uv python install; then
            echo "PINNED_REPLAY_ENVIRONMENT_ARTIFACT_UNAVAILABLE the interpreter pinned in .python-version could not be provisioned"
            exit 1
          fi

      - name: Sync the locked environment without upgrades
        run: uv sync --locked

      - name: Print and verify interpreter identity
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          uv run python -c "import sys; print(sys.version); print(sys.executable)"
          uv run python -c "import sys; sys.path.insert(0, 'tests'); import _pinned_m1d as replay; print('pinned replay interpreter', replay.verify_replay_interpreter())"

      - name: uv run pytest
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run pytest

      - name: uv run ruff check .
        run: uv run ruff check .

      - name: uv run ruff format --check .
        run: uv run ruff format --check .

      - name: uv run mypy src tests
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run mypy src tests

      - name: uv build
        if: steps.scope.outputs.docs_only != 'true'
        run: uv build

      - name: git diff --check
        run: git diff --check

      - name: git diff --check against the pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD

      - name: Verify CI changed no tracked file
        run: |
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"
