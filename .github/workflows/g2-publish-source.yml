name: g2 exact source publication (not release)

on:
  push:
    branches:
      - coord/570-publish-reviewed-tree

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'KanujVerma/drift' && github.ref == 'refs/heads/coord/570-publish-reviewed-tree'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source parent without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2e84c07f377c197c665e4ebdf16bb2d10e8ce2dc
          fetch-depth: 0
          persist-credentials: false
      - name: Verify patch and tree before fresh-branch publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request
          import zlib

          parent = '2e84c07f377c197c665e4ebdf16bb2d10e8ce2dc'
          expected_tree = '62f8088ded35870e3726dc6c8d2a173f6e73adbb'
          expected_commit = '25904cede9c82ddc2fbf8fbf7a9b944d18c0eeeb'
          expected_patch = 'e13f4fc14738d6ea3af1d4f364f36720e6d891ce8532abe65569783163129e59'
          target = 'refs/heads/coord/570-source-01'
          parts = ('95b316ebed6e2c1e5751a8ec6f686a5c9e1324ee',)
          allowed = {
              'src/drift/domain/evaluator_trace.py',
              'src/drift/evaluator/engine.py',
              'src/drift/evaluator/experiment_runner.py',
              'src/drift/evaluator/session_observer.py',
              'src/drift/intelligence/conventional_selector.py',
              'src/drift/intelligence/proposal_producer.py',
              'tests/integration/test_stage1_controlled_campaign.py',
              'tests/unit/test_stage1_controlled_contracts.py',
          }
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD') != parent or git('status', '--porcelain'):
              raise SystemExit('Unexpected or dirty source parent')
          pieces = []
          for sha in parts:
              request = urllib.request.Request(
                  'https://api.github.com/repos/KanujVerma/drift/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  item = json.load(response)
              if item['sha'] != sha or item['encoding'] != 'base64':
                  raise SystemExit('Mismatched source blob metadata')
              data = base64.b64decode(''.join(item['content'].split()), validate=True)
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != sha:
                  raise SystemExit('Source blob integrity failure')
              pieces.append(data)
          decoder = zlib.decompressobj()
          patch = decoder.decompress(b''.join(pieces), 1000000)
          if not decoder.eof or decoder.unused_data or decoder.unconsumed_tail:
              raise SystemExit('Invalid or excessive patch encoding')
          if len(patch) != 30136 or hashlib.sha256(patch).hexdigest() != expected_patch:
              raise SystemExit('Patch differs from locally tested source')
          patch_file = Path(os.environ['RUNNER_TEMP']) / 'g2-reviewed-source.patch'
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_file)], check=True)
          changed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '-z']
          ).decode().strip('\0').split('\0'))
          if changed != allowed or git('write-tree') != expected_tree:
              raise SystemExit('Unexpected source scope or tree')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          env = dict(os.environ)
          for role in ('AUTHOR', 'COMMITTER'):
              env['GIT_' + role + '_NAME'] = 'Kanuj Verma'
              env['GIT_' + role + '_EMAIL'] = '108971272+KanujVerma@users.noreply.github.com'
              env['GIT_' + role + '_DATE'] = '1793114110 +0000'
          commit = subprocess.check_output(
              ['git', 'commit-tree', expected_tree, '-p', parent],
              input='feat(stage1): observe original decisions and gate actual open execution (#570)\n',
              text=True, env=env,
          ).strip()
          if commit != expected_commit or git('rev-parse', commit + '^{tree}') != expected_tree:
              raise SystemExit('Publication commit identity mismatch')
          token = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          header = 'http.https://github.com/.extraheader=AUTHORIZATION: basic ' + token
          if git('-c', header, 'ls-remote', 'origin', target):
              raise SystemExit('Transfer branch exists; no overwrite permitted')
          subprocess.run(['git', '-c', header, 'push', 'origin', commit + ':' + target], check=True)
          print('PUBLISHED_COMMIT', commit)
          print('PUBLISHED_TREE', expected_tree)
          PY
