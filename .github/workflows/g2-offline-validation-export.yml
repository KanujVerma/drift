name: g2 isolated verification export (not release)

on:
  push:
    branches:
      - coord/g2-verification-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact published source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8af665e5f17dde676e73bf2c259f02f088abf615
          fetch-depth: 0
          persist-credentials: false
      - name: Export source ancestry only
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/g2-source-575"
          mkdir -p "$OUT"
          git bundle create "$OUT/drift-source.bundle" --all HEAD
          git bundle verify "$OUT/drift-source.bundle"
          git rev-parse HEAD > "$OUT/source-head.txt"
          cp .python-version "$OUT/python-version.txt"
          sha256sum uv.lock > "$OUT/lock-sha256.txt"
          cd "$OUT"
          sha256sum drift-source.bundle source-head.txt python-version.txt lock-sha256.txt > SHA256SUMS
          cat SHA256SUMS
      - name: Retain isolated source inputs for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g2-source-575
          path: ${{ runner.temp }}/g2-source-575/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
