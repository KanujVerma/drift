name: g2 exact source publication (not release)

on:
  push:
    branches:
      - coord/570-publish-reviewed-tree

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'KanujVerma/drift' && github.ref == 'refs/heads/coord/570-publish-reviewed-tree'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source parent without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 25904cede9c82ddc2fbf8fbf7a9b944d18c0eeeb
          fetch-depth: 0
          persist-credentials: false
      - name: Verify patch and tree before fresh-branch publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          parent = '25904cede9c82ddc2fbf8fbf7a9b944d18c0eeeb'
          expected_tree = 'fc1e79a0c75c776921b940784f3f7484982ead19'
          expected_commit = '140918fd0f1a8d5fe2b138754454fe8cf1f31320'
          expected_patch = '3cf11eac3451eaf73ec2c1f45fe869d3fc5f316d7554ec5d4278ed876972d37d'
          target = 'refs/heads/coord/570-source-02'
          parts = (
              '56ad09107886bc21b9d47d9f9199d784e46d7778',
              '3381b9e0915ffc438dbb6ee248014afd3057f9e4',
              '7c003366afdfdf54320b578c713cded2715b0306',
              '4d3e55ea3ceedb658f00e8498270429c6a9c62e0',
              '87a3c41823ca6bd77d615edb4dbc13234bbeb865',
              '30dba12ad7cc0b62f63b7da595705a388f93244d',
              'de323a8162e45d658da7266e033a06eda6e03683',
          )
          allowed = {
              'docs/architecture/adaptive-experiments/contracts/stage1-synthetic-g2.md',
              'src/drift/domain/evaluator_results.py',
              'src/drift/domain/evaluator_trace.py',
              'src/drift/evaluator/engine.py',
              'src/drift/evaluator/experiment_runner.py',
              'src/drift/evaluator/session_observer.py',
              'src/drift/experiments/stage1_trial_projection.py',
              'src/drift/loop/stage1_controlled_campaign.py',
              'src/drift/loop/stage1_controlled_contracts.py',
              'src/drift/loop/stage1_controlled_journal.py',
              'src/drift/loop/stage1_controlled_readback.py',
              'tests/adversarial/test_stage1_controlled_integrity.py',
              'tests/integration/test_stage1_controlled_campaign.py',
              'tests/unit/test_stage1_controlled_contracts.py',
              'tests/unit/test_stage1_trial_projection.py',
          }
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD') != parent or git('status', '--porcelain'):
              raise SystemExit('Unexpected or dirty source parent')
          pieces = []
          for sha in parts:
              request = urllib.request.Request(
                  'https://api.github.com/repos/KanujVerma/drift/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  item = json.load(response)
              if item['sha'] != sha or item['encoding'] != 'base64':
                  raise SystemExit('Mismatched source blob metadata')
              data = base64.b64decode(''.join(item['content'].split()), validate=True)
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != sha:
                  raise SystemExit('Source blob integrity failure')
              pieces.append(data)
          decoder = lzma.LZMADecompressor(format=lzma.FORMAT_XZ, memlimit=134217728)
          patch = decoder.decompress(b''.join(pieces), max_length=1000000)
          if not decoder.eof or decoder.unused_data:
              raise SystemExit('Invalid or excessive patch encoding')
          if len(patch) != 256822 or hashlib.sha256(patch).hexdigest() != expected_patch:
              raise SystemExit('Patch differs from locally tested source')
          patch_file = Path(os.environ['RUNNER_TEMP']) / 'g2-reviewed-source.patch'
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_file)], check=True)
          changed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '-z']
          ).decode().strip('\0').split('\0'))
          if changed != allowed or git('write-tree') != expected_tree:
              raise SystemExit('Unexpected source scope or tree')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          env = dict(os.environ)
          for role in ('AUTHOR', 'COMMITTER'):
              env['GIT_' + role + '_NAME'] = 'Kanuj Verma'
              env['GIT_' + role + '_EMAIL'] = '108971272+KanujVerma@users.noreply.github.com'
              env['GIT_' + role + '_DATE'] = '1793117808 +0000'
          commit = subprocess.check_output(
              ['git', 'commit-tree', expected_tree, '-p', parent],
              input='feat(stage1): retain controlled carried-account campaigns and cold projections (#570)\n',
              text=True, env=env,
          ).strip()
          if commit != expected_commit or git('rev-parse', commit + '^{tree}') != expected_tree:
              raise SystemExit('Publication commit identity mismatch')
          token = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          header = 'http.https://github.com/.extraheader=AUTHORIZATION: basic ' + token
          if git('-c', header, 'ls-remote', 'origin', target):
              raise SystemExit('Transfer branch exists; no overwrite permitted')
          subprocess.run(['git', '-c', header, 'push', 'origin', commit + ':' + target], check=True)
          print('PUBLISHED_COMMIT', commit)
          print('PUBLISHED_TREE', expected_tree)
          PY
