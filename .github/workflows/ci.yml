# Canonical verification gate (issue #48).
#
# CI observes repository truth; it never repairs it. This workflow never
# regenerates fixtures, never updates replay baselines, never commits and never
# pushes. The interpreter is read only from .python-version, the same pin uv
# and the pinned-replay guard in tests/_pinned_m1d.py use locally.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: canonical verification gate
    runs-on: ubuntu-latest
    # The full suite takes about 22 minutes on a developer laptop; hosted
    # runners are slower.
    timeout-minutes: 240
    env:
      # Every uv command must use uv.lock exactly as committed.
      UV_LOCKED: "1"
      # Use a uv-managed CPython build, never an ambient system interpreter.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Check out the full history
        # Pinned M1d replay extracts historical commits with git archive.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify PR changes (only allowlisted Markdown skips full tests)
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          docs_only = False
          diff_base = ""
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              event_base = os.environ.get("PR_BASE_SHA", "")
              event_head = os.environ.get("PR_HEAD_SHA", "")
              base_ref = os.environ.get("PR_BASE_REF", "")
              default_branch = os.environ.get("DEFAULT_BRANCH", "")
              sha_pattern = r"[0-9a-f]{40}"

              # The checkout is GitHub's synthetic PR merge commit. Its first
              # parent is the base version ACTUALLY tested by this workflow,
              # which may be newer than the PR event's recorded base SHA.
              # Never trust an arbitrary checkout or a caller-chosen diff base.
              if not (
                  re.fullmatch(sha_pattern, event_base)
                  and re.fullmatch(sha_pattern, event_head)
              ):
                  print("Missing/invalid PR identity: full verification required")
              elif base_ref != "main" or default_branch != "main":
                  # Non-main target branches may be mutable by PR authors.
                  # Never skip full checks for newly added code in their base.
                  print("Untrusted PR base branch: full verification required")
              else:
                  parents = subprocess.check_output(
                      ["git", "rev-list", "--parents", "-n", "1", "HEAD"],
                      text=True,
                  ).split()
                  if len(parents) != 3 or parents[2] != event_head:
                      print("Unverified PR synthetic merge: full verification required")
                  elif subprocess.run(
                      ["git", "merge-base", "--is-ancestor", event_base, parents[1]],
                      check=False,
                  ).returncode != 0:
                      print("PR event base ancestry unverified: full verification required")
                  elif subprocess.run(
                      [
                          "git", "merge-base", "--is-ancestor",
                          parents[1], "refs/remotes/origin/main",
                      ],
                      check=False,
                  ).returncode != 0:
                      print("Checked-out base not on trusted main: full verification")
                  else:
                      diff_base = parents[1]
                      raw = subprocess.check_output(
                          [
                              "git", "diff", "--name-only", "--no-renames",
                              "-z", diff_base, "HEAD",
                          ]
                      )
                      paths = [os.fsdecode(item) for item in raw.split(b"\0") if item]

                      def is_documentation(path):
                          return path in ("AGENTS.md", "README.md") or (
                              path.startswith("docs/") and path.endswith(".md")
                          )

                      docs_only = bool(paths) and all(
                          is_documentation(path) for path in paths
                      )
                      print("Verified PR merge base:", diff_base)
                      print("Changed PR paths:", repr(paths))
                      if not paths:
                          print("Empty diff: full verification required")
          else:
              print("Push to main: full verification required")

          print("Documentation-only fast path:", docs_only)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"docs_only={str(docs_only).lower()}\n")
              out.write(f"diff_base={diff_base}\n")
          PY
      - name: Check changed Markdown links and forbidden punctuation
        if: steps.scope.outputs.docs_only == 'true'
        env:
          PR_BASE_SHA: ${{ steps.scope.outputs.diff_base }}
        run: |
          python3 - <<'PY'
          import html
          import os
          import re
          import string
          import subprocess
          from pathlib import Path
          from urllib.parse import unquote, urlsplit


          def unescape(value):
              return html.unescape(re.sub(r"\\([" + re.escape(string.punctuation) + r"])", r"\1", value))


          def label(value):
              return " ".join(unescape(value).split()).casefold()


          def code_end(text, start):
              end = start
              while end < len(text) and text[end] == chr(96):
                  end += 1
              run = text[start:end]
              boundary = re.search(r"\n[ \t]*\n", text[end:])
              limit = end + boundary.start() if boundary else len(text)
              close = re.search("(?<!" + chr(96) + ")" + re.escape(run) + "(?!" + chr(96) + ")", text[end:limit])
              return end + close.end() if close else end


          def bracket(text, start):
              depth, pos = 1, start + 1
              while pos < len(text):
                  char = text[pos]
                  if char == "\\" and pos + 1 < len(text) and text[pos + 1] in string.punctuation:
                      pos += 2
                      continue
                  if char == chr(96):
                      pos = code_end(text, pos)
                      continue
                  if char == "[":
                      depth += 1
                  elif char == "]":
                      depth -= 1
                      if not depth:
                          return text[start + 1:pos], pos + 1
                  pos += 1
              return None


          def destination(text, pos):
              if pos < len(text) and text[pos] == "<":
                  start, pos = pos + 1, pos + 1
                  while pos < len(text):
                      if text[pos] == "\\" and pos + 1 < len(text) and text[pos + 1] in string.punctuation:
                          pos += 2
                          continue
                      if text[pos] == ">":
                          return unescape(text[start:pos]), pos + 1
                      if text[pos] in "<\n\r":
                          break
                      pos += 1
                  raise ValueError("unterminated angle-bracket link destination")
              start, depth = pos, 0
              while pos < len(text):
                  char = text[pos]
                  if char == "\\" and pos + 1 < len(text) and text[pos + 1] in string.punctuation:
                      pos += 2
                      continue
                  if char == "(":
                      depth += 1
                  elif char == ")":
                      if not depth:
                          break
                      depth -= 1
                  elif char.isspace():
                      if depth:
                          raise ValueError("whitespace inside unbracketed link destination")
                      break
                  elif ord(char) < 32 or char == "<":
                      raise ValueError("unsupported link destination")
                  pos += 1
              if depth:
                  raise ValueError("unbalanced link destination parentheses")
              return unescape(text[start:pos]), pos


          def finish_link(text, pos, inline):
              start = pos
              while pos < len(text) and text[pos].isspace():
                  pos += 1
              if pos > start and pos < len(text) and text[pos] in "\"'(":
                  opener = text[pos]
                  closer = ")" if opener == "(" else opener
                  pos += 1
                  while pos < len(text):
                      if text[pos] == "\\" and pos + 1 < len(text):
                          pos += 2
                          continue
                      if text[pos] == closer:
                          pos += 1
                          break
                      pos += 1
                  else:
                      raise ValueError("unterminated link title")
                  while pos < len(text) and text[pos].isspace():
                      pos += 1
              if inline:
                  if pos >= len(text) or text[pos] != ")":
                      raise ValueError("unsupported or unterminated inline link")
                  return pos + 1
              if pos != len(text):
                  raise ValueError("unsupported reference definition suffix")
              return pos


          def visible_markdown(text):
              lines, fence, comment, indented, blank = [], None, False, False, True
              container, protected_until, offset = False, 0, 0
              tick = chr(96)
              fence_pattern = r" {0,3}(" + tick + r"{3,}|~{3,})(.*)$"
              for raw_line in text.splitlines(keepends=True):
                  line = raw_line.rstrip("\r\n")
                  begin, offset = offset, offset + len(raw_line)
                  expanded = line.expandtabs(4)
                  if fence:
                      if re.fullmatch(r" {0,3}" + re.escape(fence[0]) + "{" + str(fence[1]) + r",}[ \t]*", expanded):
                          fence = None
                      lines.append("")
                      continue
                  if not comment and protected_until <= begin:
                      if re.match(r" {0,3}(?:[-+*]|\d+[.)])\s+", expanded):
                          container = True
                      elif expanded and not expanded[0].isspace() and not expanded.startswith(">"):
                          container = False
                  if not comment and expanded.startswith("    ") and (blank or indented):
                      if container:
                          raise ValueError("indented container content is unsupported by the fast validator")
                      indented = True
                      lines.append("")
                      continue
                  indented = False
                  if not comment and protected_until <= begin:
                      prefix = r" {0,3}(?:>\s*|(?:[-+*]|\d+[.)])\s+)"
                      if re.match(prefix + ".*(?:" + tick + r"{3}|~{3})", expanded):
                          raise ValueError("container code fences are unsupported by the fast validator")
                      if re.match(prefix + r"\[[^\n]*\]:", expanded):
                          raise ValueError("container reference definitions are unsupported by the fast validator")
                      if re.match(r" {0,3}</?[A-Za-z][A-Za-z0-9-]*(?:\s|/?>)", expanded):
                          raise ValueError("HTML blocks are unsupported by the fast validator")
                      match = re.match(fence_pattern, expanded)
                      if match and (match[1][0] != tick or tick not in match[2]):
                          fence = (match[1][0], len(match[1]))
                          lines.append("")
                          blank = True
                          continue
                  cleaned, pos = "", 0
                  while pos < len(line):
                      if protected_until > begin + pos:
                          end = min(len(line), protected_until - begin)
                          cleaned += line[pos:end]
                          pos = end
                          continue
                      if comment:
                          end = line.find("-->", pos)
                          if end < 0:
                              break
                          comment, pos = False, end + 3
                          continue
                      if line[pos] == "\\" and pos + 1 < len(line) and line[pos + 1] in string.punctuation:
                          cleaned += line[pos:pos + 2]
                          pos += 2
                          continue
                      if line[pos] == tick:
                          run_end = begin + pos
                          while run_end < len(text) and text[run_end] == tick:
                              run_end += 1
                          stop = code_end(text, begin + pos)
                          if stop > run_end and not re.search(
                              r"(?m)^ {0,3}(?:" + tick + r"{3,}|~{3,})", text[run_end:stop]
                          ):
                              protected_until = stop
                              continue
                      if line.startswith("<!--", pos):
                          comment, pos = True, pos + 4
                          continue
                      cleaned += line[pos]
                      pos += 1
                  lines.append(cleaned)
                  blank = not cleaned.strip()
              return "\n".join(lines)


          def local_targets(text, inherited=None):
              visible = visible_markdown(text)
              refs, lines = dict(inherited or {}), visible.splitlines()
              originals = lines.copy()
              offsets, offset = [], 0
              for source_line in visible.splitlines(keepends=True):
                  offsets.append(offset)
                  offset += len(source_line)
              code_until, definition_end = 0, -1
              for number, line in enumerate(lines):
                  match = re.match(r" {0,3}\[", line)
                  parsed = bracket(line, match.end() - 1) if match else None
                  is_definition = parsed and line[parsed[1]:].startswith(":")
                  if code_until > offsets[number] or not is_definition:
                      pos = max(0, code_until - offsets[number])
                      while pos < len(line):
                          if line[pos] == "\\" and pos + 1 < len(line) and line[pos + 1] in string.punctuation:
                              pos += 2
                          elif line[pos] == chr(96):
                              stop = code_end(visible, offsets[number] + pos)
                              run_end = offsets[number] + pos
                              while run_end < len(visible) and visible[run_end] == chr(96):
                                  run_end += 1
                              if stop > run_end:
                                  code_until = stop
                              pos = stop - offsets[number]
                          else:
                              pos += 1
                      continue
                  if number and originals[number - 1].strip() and definition_end != number - 1:
                      raise ValueError("paragraph-adjacent reference definitions are unsupported by the fast validator")
                  name, end = parsed
                  value = line[end + 1:].lstrip()
                  consumed = number
                  if not value and number + 1 < len(lines):
                      consumed += 1
                      value = lines[consumed].lstrip()
                  target, end = destination(value, 0)
                  if not target:
                      raise ValueError("empty reference destination")
                  if not value[end:].strip() and consumed + 1 < len(lines):
                      following = lines[consumed + 1].lstrip()
                      if following.startswith(('"', "'", "(")):
                          consumed += 1
                          value += "\n" + lines[consumed]
                  while True:
                      try:
                          finish_link(value, end, False)
                          break
                      except ValueError as exc:
                          if str(exc) != "unterminated link title" or consumed + 1 >= len(lines) or not lines[consumed + 1].strip():
                              raise
                          consumed += 1
                          value += "\n" + lines[consumed]
                  refs.setdefault(label(name), target)
                  for index in range(number, consumed + 1):
                      lines[index] = ""
                  definition_end = consumed
              visible, pos = "\n".join(lines), 0
              while pos < len(visible):
                  char = visible[pos]
                  if char == "\\" and pos + 1 < len(visible) and visible[pos + 1] in string.punctuation:
                      pos += 2
                      continue
                  if char == chr(96):
                      pos = code_end(visible, pos)
                      continue
                  if char == "<" and re.match(r"</?(?:a|img)\b", visible[pos:], re.I):
                      raise ValueError("HTML link/image destinations require full verification")
                  if char != "[":
                      pos += 1
                      continue
                  parsed = bracket(visible, pos)
                  if not parsed:
                      pos += 1
                      continue
                  name, end = parsed
                  if "\n" in name and visible[end:].startswith(":"):
                      raise ValueError("multiline reference labels are unsupported by the fast validator")
                  yield from local_targets(name, refs)
                  after = end
                  if after < len(visible) and visible[after] == "(":
                      start = after + 1
                      while start < len(visible) and visible[start].isspace():
                          start += 1
                      target, stop = destination(visible, start)
                      yield target
                      pos = finish_link(visible, stop, True)
                      continue
                  if end < len(visible) and visible[end] == "[":
                      reference = bracket(visible, end)
                      if reference:
                          key, stop = reference
                          if label(key or name) in refs:
                              yield refs[label(key or name)]
                              pos = stop
                              continue
                  if label(name) in refs:
                      yield refs[label(name)]
                  # Continue through labels as they may contain nested image/link syntax.
                  pos += 1


          root = Path.cwd().resolve()
          raw = subprocess.check_output([
              "git", "diff", "--name-status", "--no-renames", "-z",
              os.environ["PR_BASE_SHA"], "HEAD",
          ])
          items = raw.split(b"\0")
          if not items or items[-1] != b"" or len(items[:-1]) % 2:
              raise SystemExit("Malformed changed-document status list")
          failures, checked = [], 0
          for index in range(0, len(items) - 1, 2):
              status = items[index].decode("ascii")
              path = Path(os.fsdecode(items[index + 1]))
              if status not in ("A", "M", "D", "T"):
                  raise SystemExit(f"{path}: unsupported change status {status}")
              if status == "D":
                  continue
              if path.is_symlink() or not path.is_file():
                  failures.append(f"{path}: expected a regular Markdown file")
                  continue
              text = path.read_text(encoding="utf-8")
              checked += 1
              if "\u2014" in text:
                  failures.append(f"{path}: forbidden U+2014 em dash")
              try:
                  for target in local_targets(text):
                      if not target or target.startswith(("#", "//")):
                          continue
                      parsed = urlsplit(target)
                      if parsed.scheme or parsed.netloc or not parsed.path:
                          continue
                      resolved = (path.parent / unquote(parsed.path)).resolve()
                      if not resolved.is_relative_to(root) or not resolved.exists():
                          failures.append(f"{path}: unresolved link {target}")
              except ValueError as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Documentation checks passed for {checked} changed Markdown files")
          PY
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Provision the interpreter pinned in .python-version
        run: |
          echo "interpreter pin: $(cat .python-version)"
          if ! uv python install; then
            echo "PINNED_REPLAY_ENVIRONMENT_ARTIFACT_UNAVAILABLE the interpreter pinned in .python-version could not be provisioned"
            exit 1
          fi

      - name: Sync the locked environment without upgrades
        run: uv sync --locked

      - name: Print and verify interpreter identity
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          uv run python -c "import sys; print(sys.version); print(sys.executable)"
          uv run python -c "import sys; sys.path.insert(0, 'tests'); import _pinned_m1d as replay; print('pinned replay interpreter', replay.verify_replay_interpreter())"

      - name: uv run pytest
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run pytest

      - name: uv run ruff check .
        run: uv run ruff check .

      - name: uv run ruff format --check .
        run: uv run ruff format --check .

      - name: uv run mypy src tests
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run mypy src tests

      - name: uv build
        if: steps.scope.outputs.docs_only != 'true'
        run: uv build

      - name: git diff --check
        run: git diff --check

      - name: git diff --check against the pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ steps.scope.outputs.diff_base || github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD

      - name: Verify CI changed no tracked file
        run: |
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"
