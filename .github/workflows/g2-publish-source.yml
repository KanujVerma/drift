name: g2 exact source publication (not release)

on:
  push:
    branches:
      - coord/564-publish-reviewed-tree

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'KanujVerma/drift' && github.ref == 'refs/heads/coord/564-publish-reviewed-tree'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed integration parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 78d0fd4ef37a7c087ada00b5d012de007a832cba
          fetch-depth: 0
          persist-credentials: false
      - name: Verify patch, scope and tree before isolated publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request
          import zlib

          parent = '78d0fd4ef37a7c087ada00b5d012de007a832cba'
          expected_tree = '9d85885d66f5672943f130239a4a131f7425a63b'
          expected_patch = '9eefcc49f4162f2602fdd79693a15404dc09c408f4e7d2049cac9de25fe01106'
          target = 'refs/heads/coord/564-transfer-failed-evidence'
          parts = (
              'd7402c8c0177edc1d82cb5222935d349c11c6c60',
              '50878ca08ecf00620f62b7e2f4f1b0e2ea69e8f0',
              '2e2d9c66f2b38961ed7388ed10bb618ec1f24c36',
              '97b7b6fbc086db04239756ab960e55fdbdc8a4aa',
              '0949c36872fbb9d1274f1d323044a113b760d1b7',
              '0f30de340db866b531634238b22166d940d73eb5',
              'ecbbcfd6b5888e41324f1b26dec72b13269e580e',
          )
          allowed = {
              'docs/architecture/adaptive-experiments/verification/stage1-research-execution-candidate.md',
              'src/drift/loop/stage1_synthetic_research_execution.py',
              'tests/adversarial/test_stage1_research_execution_integrity.py',
          }
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD') != parent or git('status', '--porcelain'):
              raise SystemExit('Unexpected or dirty source parent')
          pieces = []
          for sha in parts:
              request = urllib.request.Request(
                  'https://api.github.com/repos/KanujVerma/drift/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  item = json.load(response)
              if item['sha'] != sha or item['encoding'] != 'base64':
                  raise SystemExit('Mismatched source blob metadata')
              data = base64.b64decode(''.join(item['content'].split()), validate=True)
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != sha:
                  raise SystemExit('Source blob integrity failure')
              pieces.append(data)
          decoder = zlib.decompressobj()
          patch = decoder.decompress(b''.join(pieces), 1000000)
          if not decoder.eof or decoder.unused_data or decoder.unconsumed_tail:
              raise SystemExit('Invalid or excessive patch encoding')
          if len(patch) != 18625 or hashlib.sha256(patch).hexdigest() != expected_patch:
              raise SystemExit('Patch differs from the locally tested source')
          patch_file = Path(os.environ['RUNNER_TEMP']) / 'g2-reviewed-source.patch'
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_file)], check=True)
          changed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '-z']
          ).decode().strip('\0').split('\0'))
          if changed != allowed or git('write-tree') != expected_tree:
              raise SystemExit('Unexpected source scope or tree')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(stage1): verify original failed invocation evidence (#564)'], check=True)
          if git('rev-parse', 'HEAD^') != parent or git('rev-parse', 'HEAD^{tree}') != expected_tree:
              raise SystemExit('Publication commit identity mismatch')
          token = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          header = 'http.https://github.com/.extraheader=AUTHORIZATION: basic ' + token
          existing = git('-c', header, 'ls-remote', 'origin', target)
          if existing:
              raise SystemExit('Transfer branch already exists; no overwrite permitted')
          subprocess.run(['git', '-c', header, 'push', 'origin', 'HEAD:' + target], check=True)
          print('PUBLISHED_COMMIT', git('rev-parse', 'HEAD'))
          print('PUBLISHED_TREE', git('rev-parse', 'HEAD^{tree}'))
          PY
