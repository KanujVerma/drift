name: Temporary issue 490 read-only pinned focused verification
on:
  push:
    branches:
      - coord/490-readonly-focused-qa-20261020
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_LOCKED: "1"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Checkout full history without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
      - name: Pinned sync
        run: |
          uv python install
          uv sync --locked
      - name: Focused regression
        run: uv run pytest -q tests/unit/test_stage1_switch_preflight.py
      - name: Exact touched scope Ruff lint and format
        run: |
          uv run ruff check src/drift/loop/stage1_switch_preflight.py tests/unit/test_stage1_switch_preflight.py
          uv run ruff format --check src/drift/loop/stage1_switch_preflight.py tests/unit/test_stage1_switch_preflight.py
      - name: Strict Mypy src and tests
        run: uv run mypy src tests
      - name: Package build and no tracked changes
        run: |
          uv build
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
