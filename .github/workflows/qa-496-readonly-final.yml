name: Temporary issue 496 final static read-only verification
on:
  push:
    branches:
      - coord/496-readonly-final-qa-20261020
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_LOCKED: "1"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Checkout full historical source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
      - name: Install pinned environment
        run: |
          uv python install
          uv sync --locked
      - name: Source capability and triage focused tests
        run: |
          uv run pytest -q tests/integration/test_m1e_compatibility.py tests/unit/test_news_triage.py
      - name: Exact guard lint and format
        run: |
          uv run ruff check tests/integration/test_m1e_compatibility.py src/drift/news_triage tests/unit/test_news_triage.py
          uv run ruff format --check tests/integration/test_m1e_compatibility.py src/drift/news_triage tests/unit/test_news_triage.py
      - name: Strict type and build
        run: |
          uv run mypy src tests
          uv build
      - name: Clean check
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
