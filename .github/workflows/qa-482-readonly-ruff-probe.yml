name: Temporary Drift static QA formatting probe
on:
  push:
    branches:
      - krish/482-readonly-format-probe-20261020
permissions:
  contents: read
jobs:
  static-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_LOCKED: "1"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Checkout source without push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
      - name: Provision interpreter
        run: uv python install
      - name: Install locked environment
        run: uv sync --locked
      - name: Display original Mypy errors
        shell: bash
        run: |
          echo "__MYPY_ORIGINAL_BEGIN__"
          uv run mypy src tests || true
          echo "__MYPY_ORIGINAL_END__"
      - name: Collect official Ruff fixes and formatting without committing
        shell: bash
        run: |
          uv run ruff check --fix . || true
          uv run ruff format .
          echo "__RUFF_REMAINING_BEGIN__"
          uv run ruff check . || true
          echo "__RUFF_REMAINING_END__"
          echo "__MYPY_POSTFORMAT_BEGIN__"
          uv run mypy src tests || true
          echo "__MYPY_POSTFORMAT_END__"
          uv run python - <<'PY'
          import base64
          import json
          import pathlib
          import subprocess

          changed = [
              item.decode("utf-8")
              for item in subprocess.check_output(
                  ["git", "diff", "--name-only", "-z"]
              ).split(b"\x00")
              if item
          ]
          allowed = (
              "src/drift/intelligence/",
              "tests/unit/test_intelligence_",
              "tests/integration/test_m1e_compatibility.py",
              "tests/integration/test_stage1_intelligence_end_to_end.py",
              "tests/adversarial/test_intelligence_causality.py",
              "docs/handoffs/krish-stage1-antigravity-validation.md",
          )
          assert all(name.startswith(allowed) for name in changed), changed
          print("__FORMATTED_FILES_BEGIN__")
          for name in changed:
              payload = base64.b64encode(pathlib.Path(name).read_bytes()).decode("ascii")
              print("__FILE__" + json.dumps(
                  {"path": name, "base64": payload}, separators=(",", ":")
              ))
          print("__FORMATTED_FILES_END__")
          PY
