name: g2 exact source publication (not release)

on:
  push:
    branches:
      - coord/575-publish-exact-source

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'KanujVerma/drift' && github.ref == 'refs/heads/coord/575-publish-exact-source'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact published parent without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fcaae6ca6da4f18f2874c1d9ae43e97e324a817d
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact patch and tree before fresh-branch publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          parent = 'fcaae6ca6da4f18f2874c1d9ae43e97e324a817d'
          expected_tree = '26b8d2b7470e7199bede6f9c0e8c773d6b3c4df8'
          expected_commit = '5664e06aab068ef279646f1cd625763b6e931777'
          expected_patch = 'f18090ed18c45d8f4f1b7ccf2b35a1fbb5cc61daf1edeaf29b5beab61c1d4fe0'
          target = 'refs/heads/coord/575-source-02'
          blob_sha = '293ac68831a1cfff46b01acc92f5c19844c9bec2'
          allowed = {
              'docs/architecture/adaptive-experiments/contracts/stage1-synthetic-g2.md',
              'tests/integration/test_stage1_controlled_campaign.py',
          }
          env = dict(os.environ)
          for role in ('AUTHOR', 'COMMITTER'):
              env['GIT_' + role + '_NAME'] = 'Kanuj Verma'
              env['GIT_' + role + '_EMAIL'] = '108971272+KanujVerma@users.noreply.github.com'
              env['GIT_' + role + '_DATE'] = '1793581200 +0000'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True, env=env).strip()
          if git('rev-parse', 'HEAD') != parent or git('status', '--porcelain'):
              raise SystemExit('Unexpected or dirty source parent')
          request = urllib.request.Request(
              'https://api.github.com/repos/KanujVerma/drift/git/blobs/' + blob_sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              item = json.load(response)
          if item['sha'] != blob_sha or item['encoding'] != 'base64':
              raise SystemExit('Mismatched source blob metadata')
          data = base64.b64decode(''.join(item['content'].split()), validate=True)
          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if actual != blob_sha:
              raise SystemExit('Source blob integrity failure')
          decoder = lzma.LZMADecompressor(format=lzma.FORMAT_XZ, memlimit=134217728)
          patch = decoder.decompress(data, max_length=1000000)
          if not decoder.eof or decoder.unused_data:
              raise SystemExit('Invalid or excessive patch encoding')
          if len(patch) != 8483 or hashlib.sha256(patch).hexdigest() != expected_patch:
              raise SystemExit('Patch differs from locally tested source')
          patch_file = Path(os.environ['RUNNER_TEMP']) / 'g2-reviewed-source.patch'
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_file)], check=True)
          changed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '-z']
          ).decode().strip('\0').split('\0'))
          if changed != allowed or git('write-tree') != expected_tree:
              raise SystemExit('Unexpected source scope or tree')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          commit = subprocess.check_output(
              ['git', 'commit-tree', expected_tree, '-p', parent],
              input='fix(stage1): observe both completed original arms before paired comparison (#575)\n',
              text=True, env=env,
          ).strip()
          if commit != expected_commit:
              raise SystemExit('Publication commit identity mismatch')
          token = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          header = 'http.https://github.com/.extraheader=AUTHORIZATION: basic ' + token
          if git('-c', header, 'ls-remote', 'origin', target):
              raise SystemExit('Transfer branch exists; no overwrite permitted')
          subprocess.run(['git', '-c', header, 'push', 'origin', commit + ':' + target], check=True)
          print('PUBLISHED_COMMIT', commit)
          print('PUBLISHED_TREE', expected_tree)
          PY
