name: Drift executable task
description: One owner, exact paths, evidence, blockers and acceptance criteria.
title: "[<Feature>][<Owner>] <bounded task>"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        One accountable owner and one writer per overlapping write-set.
        Add exactly one workstream label, one state label and appropriate kind/priority labels after creation.
        GitHub is live state. Accepted docs own design. A parent issue is not implementation permission.
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream owner
      options: [kanuj, krish, matthew, harsha]
    validations:
      required: true
  - type: input
    id: feature
    attributes:
      label: Feature and roadmap mapping
      description: Feature identifier and applicable historical milestone, or coordination.
    validations:
      required: true
  - type: input
    id: slice
    attributes:
      label: Task or slice
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: Initial state
      options: [blocked, ready, in-progress, review]
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective and non-goals
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Dependencies and blocked-by
      description: Native issue edges plus exact text; name contract PR acceptance and permission conditions.
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Consumed contracts and required accepted versions
    validations:
      required: true
  - type: textarea
    id: writes
    attributes:
      label: Exact allowed write-set
      description: One explicit repository path per line; broad directory ownership is not enough.
    validations:
      required: true
  - type: textarea
    id: protected
    attributes:
      label: Protected or read-only surfaces and active writers
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test and evidence requirements
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation impact
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Stop conditions and architecture review requirement
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Network, credential, cost and operational authorization
      description: State none unless explicit authorization is linked. Simulation is not live permission.
    validations:
      required: true
  - type: textarea
    id: pr
    attributes:
      label: Expected branch and PR boundary
    validations:
      required: true
  - type: textarea
    id: progress
    attributes:
      label: Claim, checkpoint, handoff and next action
    validations:
      required: true
